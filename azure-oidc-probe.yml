trigger: none
pr: none

variables:
  system.debug: true

pool:
  vmImage: ubuntu-latest

steps:
  - task: AWSCLI@1
    displayName: Test AWS OIDC federation
    inputs:
      awsCredentials: 'aws-oidc-nexus-ops'
      regionName: 'eu-north-1'
      awsCommand: 'sts'
      awsSubCommand: 'get-caller-identity'
