trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: nexus-ops
  imageTag: $(Build.BuildId)

steps:
  - checkout: self
    displayName: Checkout source code

  - task: UsePythonVersion@0
    displayName: Use Python 3.11
    inputs:
      versionSpec: '3.11'
      architecture: 'x64'

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt pytest
    displayName: Install Python dependencies

  - script: |
      echo "Sources: $(Build.SourcesDirectory)"
      export PYTHONPATH="$(Build.SourcesDirectory):${PYTHONPATH:-}"
      python -m pytest -q
    displayName: Run unit tests

  - script: docker build -t $(imageName):$(imageTag) .
    displayName: Build Docker image

  - script: |
      set -euo pipefail
      container_name=nexus-ops-ci

      cleanup() {
        docker logs "$container_name" || true
        docker rm -f "$container_name" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      docker run -d \
        --name "$container_name" \
        -p 127.0.0.1:8001:8000 \
        "$(imageName):$(imageTag)"

      ready=0
      for attempt in $(seq 1 30); do
        if curl -fsS http://127.0.0.1:8001/health; then
          ready=1
          break
        fi
        sleep 2
      done

      test "$ready" -eq 1

      curl -fsS http://127.0.0.1:8001/metrics \
        | grep -q 'http_requests_total'

      echo "Health and metrics smoke tests passed."
    displayName: Test Docker container health and metrics
