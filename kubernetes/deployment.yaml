apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ops
  labels:
    app: nexus-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ops
  template:
    metadata:
      labels:
        app: nexus-ops
    spec:
      containers:
        - name: nexus-ops
          image: hossam789/nexus-ops:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
